    { name = "httpx", marker = "extra == 'dev'", specifier = ">=0.28" },
    { name = "numpy", specifier = ">=2.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.12" },
    { name = "scipy", specifier = ">=1.11" },
    { name = "shapely", specifier = ">=2.1" },
    { name = "torch", marker = "sys_platform != 'linux'", specifier = ">=2.4" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.4", index = "https://download.pytorch.org/whl/cpu" },
    { name = "uvicorn", specifier = ">=0.30" },
]
provides-extras = ["dev"]
